<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ru" }}" dir="{{ or site.Language.LanguageDirection `ltr` }}" class="h-full scroll-smooth">
<head>
    {{ partial "head.html" . }}
</head>
<body class="min-h-full flex flex-col bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 transition-colors duration-300">

    <header id="header">
        {{ partial "header.html" . }}
    </header>

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    <footer id="footer" class="bg-neutral-50 dark:bg-neutral-950 text-neutral-500 dark:text-neutral-400 text-[13px] pt-16 pb-8 border-t border-neutral-200/50 dark:border-neutral-900 transition-colors duration-300">
        {{ partial "footer.html" . }}
    </footer>

    <script src="{{ "js/main.js" | relURL }}"></script>

</body>
</html>
