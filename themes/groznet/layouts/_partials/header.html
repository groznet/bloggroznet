<!-- Topbar -->
<div class="border-b border-gray-200 text-[14px] text-gray-500 py-2">
    <div class="container flex flex-wrap justify-between">

        <div class="w-1/2 md:w-1/4">
            <p>Создание сайтов в Грозном</p>
        </div>

        <div class="w-1/2 md:w-1/4">
            <div class="flex justify-end md:justify-start items-center gap-x-3 text-gray-600">
                {{ range .Site.Params.social }}
                    <a href="{{ .url | safeURL }}" title="{{ .name }}" target="_blank" rel="noopener">
                        <i class="{{ .icon }}"></i>
                    </a>
                {{ end }}
            </div>
        </div>

        <div class="w-1/2 md:w-1/4">
            <p>
                <a href="#">Гарантия</a>
                <a href="/contact">Помощь</a>
                <a href="#">ЧАВО</a>
            </p>
        </div>

        <div class="w-1/2 md:w-1/4">
            <p class="text-right">
                <i class="fa fa-lock"></i>
                <a href="/login">Вход</a>
                <a href="/register">Регистрация</a>
            </p>
        </div>

    </div>
</div>

<!-- Midbar -->

    <div class="container flex flex-wrap justify-between">

                    class="w-[2.8em] opacity-60"
                >
            </a>

            <a href="https://groznet.com/" class="hover:no-underline">
                <p class="-ml-[1.4em]">
                    <span class="text-[28px] font-bold text-white [text-shadow:1px_1px_3px_rgb(100_115_125),0_0_3px_#92a6ae] font-serif">
                        <span class="invisible">G</span>rozNet
                    </span>
                </p>
            </a>
        </div>

        <!-- Worktime -->
        <div class="flex items-center justify-end md:justify-center gap-2 w-2/3 lg:w-1/5 py-2 md:py-5">
            <img
                src="/images/icons/worktime-48x48.png"
                width="35"
                class="opacity-60"
                alt="График работы"
            >

            <p class="text-[15px]">
                <span class="text-gray-700">
                    Пон - Суб 9:00 - 18:00
                </span>
                <br>
                <span class="text-sm text-gray-500">
                    Служба поддержки 24/7
                </span>
            </p>
        </div>

        <!-- Address -->
        <div
            id="address"
            class="flex items-center justify-start md:justify-center gap-2 w-1/2 lg:w-1/5 py-2 md:py-5 md:bg-[url('/images/address-bg.png')] bg-no-repeat"
        >

                src="/images/icons/office-address-48x48.png"
                width="35"
                class="opacity-60"
                alt="Адрес"
            >

            <p class="text-[15px]">
                <span class="text-gray-700">
                    пр-т Путина 8
                </span>
                <br>
                <span class="text-sm text-gray-500">
                    Грозный, Чечня
                </span>
            </p>
        </div>

        <!-- Contacts -->
        <div
            id="contacts"
            class="flex items-center justify-end md:justify-center gap-2 w-1/2 lg:w-1/5 py-0 md:py-5 md:bg-[url('/images/contacts-bg.png')] bg-no-repeat"
        >
            <img
                src="/images/icons/contact-us-icon-51x48.png"
                width="35"
                class="opacity-60"
                alt="Контакты"
            >

            <p class="text-[15px]">
                <span class="text-gray-700">
                    <a href="tel:+79298883327">
                        8 (929) 888-33-27
                    </a>
                </span>
                <br>
                <span class="text-sm text-gray-500">
                    <a href="mailto:info@groznet.com">
                        info@groznet.com
                    </a>
                </span>
            </p>
        </div>

        <!-- CTA -->
        <div class="hidden lg:flex items-center justify-end w-1/5">
            <a href="/contact">
                <button class="px-4 py-2 rounded-[15px] bg-[#52ab98] text-white">
                    <i class="fa fa-shopping-cart"></i>
                    Заказать сайт
                </button>
            </a>
        </div>

    </div>
</div>

<!-- Navigation -->
<div class="border-y border-gray-200 bg-white">
    <div class="container mx-auto px-0 clear-both">
        <form id="search-form" class="float-right leading-[46px] pr-[15px] md:pr-0 flex items-center h-[46px] space-x-2" >
            <input
                type="text"
                name="keyword"
                placeholder="Введите название..."
                class="text-gray-600 text-sm px-3 py-1 bg-gray-50 border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400"
                >
            <input
                type="submit"
                value="Найти"
                class="text-gray-600 text-sm bg-white border border-gray-300 rounded px-3 py-1 hover:bg-gray-50 cursor-pointer transition-colors font-medium"
                >
        </form>
        <span
            id="menu"
            class="block md:hidden leading-[46px] text-gray-600 hover:text-gray-900 cursor-pointer select-none transition-colors"
            >
        <i class="fa fa-bars pl-[15px] text-lg"></i>
        </span>
        <nav id="navbar" class="hidden md:block clear-both md:clear-none">
            <ul class="m-0 p-0 list-none leading-[45px]">
                {{ range .Site.Menus.main }}
                <li class="md:inline-block border-t md:border-0 border-gray-200">
                    <a href="{{ .URL | relLangURL }}" class="block px-4 py-2 text-gray-600 no-underline text-sm font-medium">
                        {{ .Name }}
                    </a>
                </li>
                {{ end }}
            </ul>
        </nav>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var currentPath = window.location.pathname;

        document.querySelectorAll(".navbar a").forEach(function (link) {
            if (link.getAttribute("href") === currentPath) {
                link.parentNode.classList.add("active");
            }
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Active link highlighting
        var currentPath = window.location.pathname;
        document.querySelectorAll("#navbar a").forEach(function (link) {
            if (link.getAttribute("href") === currentPath || link.getAttribute("href") === window.location.origin + currentPath) {
                link.parentNode.classList.add("active");
            }
        });

        // Mobile menu toggle
        var toggle = document.getElementById("menu");
        var nav = document.getElementById("navbar");

        if (toggle && nav) {
            toggle.addEventListener("click", function () {
                // If Tailwind's 'hidden' class is active, we strip it out to show the menu
                if (nav.classList.contains("hidden")) {
                    nav.classList.remove("hidden");
                } else {
                    nav.classList.add("hidden");
                }
            });
        }
    });
</script>
